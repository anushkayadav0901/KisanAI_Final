<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — Kisan AI</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FDFCF8;color:#5B532C;
       font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
  .card{max-width:420px;text-align:center}
  .icon{width:64px;height:64px;border-radius:20px;background:rgba(99,163,97,.12);
        display:grid;place-items:center;margin:0 auto 20px;font-size:30px}
  h1{font-size:24px;font-weight:700;margin:0 0 10px}
  p{color:rgba(91,83,44,.65);margin:0 0 22px}
  .note{background:rgba(253,231,179,.4);border:1px solid rgba(91,83,44,.1);
        border-radius:14px;padding:14px 16px;font-size:14px;text-align:left}
  b{display:block;margin-bottom:3px}
  button{font:600 14px inherit;color:#fff;background:#63A361;border:0;
         padding:11px 26px;border-radius:999px;cursor:pointer;margin-top:20px}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🌾</div>
    <h1>You are offline</h1>
    <p>Kisan AI could not reach the network, and this page was not saved on your device.</p>
    <div class="note">
      <b>Your work is safe.</b>
      Crop photos you captured without signal are stored on this device and will be
      analysed automatically once the connection returns.
    </div>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
